[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 7 necesita Node 20.19 o superior (con Node 18 la compilación falla)
  NODE_VERSION = "22"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cabeceras de seguridad básicas
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Los archivos con huella en el nombre (assets/index-XXXX.js) nunca cambian: caché larga
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
